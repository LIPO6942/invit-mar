<style>

html{-webkit-tap-highlight-color:transparent}
body{font-family:'Amiri',serif;background:var(--bg);color:var(--text);min-height:100dvh;overflow-x:hidden}

#login-screen{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;z-index:1}
.login-card{background:rgba(255,248,220,0.04);border:1px solid var(--border);border-radius:24px;padding:44px 32px 36px;width:100%;max-width:380px;text-align:center;backdrop-filter:blur(12px);box-shadow:0 20px 60px rgba(0,0,0,0.5);animation:fadeInUp 0.6s ease both}
@keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.login-icon{font-size:3.2rem;margin-bottom:16px}
.login-title{font-size:1.7rem;color:var(--gold);font-weight:700;margin-bottom:5px}
.login-sub{font-size:0.88rem;color:var(--muted);margin-bottom:24px;line-height:1.5}
.ornament{text-align:center;color:rgba(201,168,76,0.3);font-size:0.7rem;letter-spacing:6px;margin:6px 0 18px}
.login-input{width:100%;background:rgba(0,0,0,0.35);border:1px solid var(--border);border-radius:12px;padding:13px 18px;color:var(--text);font-size:1.1rem;margin-bottom:14px;outline:none;text-align:center;letter-spacing:5px;font-family:monospace;transition:border-color 0.2s}
.login-input:focus{border-color:var(--gold)}
.login-btn{width:100%;background:linear-gradient(135deg,#c9a84c 0%,#e8cc7a 50%,#c9a84c 100%);color:#1a1000;border:none;border-radius:12px;padding:14px;font-size:1.05rem;font-weight:700;font-family:'Amiri',serif;cursor:pointer;transition:opacity 0.2s,transform 0.1s}
.login-btn:hover{opacity:0.92}.login-btn:active{transform:scale(0.98)}
.login-error{color:var(--danger);font-size:0.85rem;margin-top:10px;min-height:20px}
#main-app{max-width:680px;margin:0 auto;padding:20px 14px 80px;position:relative;z-index:1}
.app-header{background:rgba(10,6,2,0.92);border:1px solid var(--border);border-radius:20px;padding:20px;text-align:center;margin-bottom:20px;backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(0,0,0,0.4)}
.header-couple{font-size:1.5rem;color:var(--gold);font-weight:700}
.header-sub{font-size:0.88rem;color:var(--muted);margin-top:4px}
.stats-row{display:flex;gap:12px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.stat-pill{background:rgba(201,168,76,0.1);border:1px solid var(--border);border-radius:20px;padding:5px 16px;font-size:0.82rem;color:var(--gold-l)}
.stat-pill strong{color:var(--gold)}
.lang-banner{display:flex;align-items:center;gap:8px;background:rgba(46,204,113,0.08);border:1px solid rgba(46,204,113,0.25);border-radius:10px;padding:8px 14px;font-size:0.82rem;color:#82e0aa;margin-bottom:14px}
.section{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:20px;margin-bottom:20px}
.section-title{font-size:1.1rem;color:var(--gold);font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.help-box{background:rgba(201,168,76,0.06);border:1px solid rgba(201,168,76,0.18);border-radius:12px;padding:12px 16px;font-size:0.84rem;color:var(--muted);line-height:1.6;margin-bottom:16px}
.help-box strong{color:var(--gold-l)}
.f-input{width:100%;background:rgba(0,0,0,0.3);border:1px solid var(--border);border-radius:10px;padding:10px 14px;color:var(--text);font-size:0.95rem;font-family:'Amiri',serif;outline:none;transition:border-color 0.2s}
.f-input:focus{border-color:var(--gold)}
.btn-primary{width:100%;background:linear-gradient(135deg,#c9a84c 0%,#e8cc7a 50%,#c9a84c 100%);color:#1a1000;border:none;border-radius:12px;padding:14px;font-size:1.05rem;font-weight:700;font-family:'Amiri',serif;cursor:pointer;transition:opacity 0.2s,transform 0.1s}
.btn-primary:hover{opacity:0.92}.btn-primary:active{transform:scale(0.98)}
.views-badge{display:inline-flex;align-items:center;gap:3px;font-size:0.72rem;color:rgba(200,180,120,0.7);background:rgba(201,168,76,0.08);border:1px solid rgba(201,168,76,0.18);border-radius:20px;padding:2px 8px;white-space:nowrap;flex-shrink:0}

.name-warn{font-size:0.74rem;color:var(--warn);margin-top:3px;display:flex;align-items:flex-start;gap:4px;line-height:1.4}
.name-warn span{flex:1}
#val-modal{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px}
#dup-modal{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-box{background:#1a1106;border:1px solid rgba(201,168,76,0.4);border-radius:18px;padding:24px;max-width:500px;width:100%;display:flex;flex-direction:column;gap:14px}

<div id="login-screen">

    <button class="btn-primary" onclick="saveGuestListSubmit()" style="font-size:1.1rem;padding:15px;" id="save-btn">💾</button>
  </div>
</div>

<!-- Duplicate modal -->
<div id="dup-modal" style="display:none">

    <div style="display:flex;align-items:center;justify-content:space-between;">
      <h3 style="margin:0;color:var(--warn);font-size:1rem;" id="dup-title">🔁</h3>
      <button onclick="document.getElementById('dup-modal').style.display='none'" style="background:none;border:none;color:#aaa;font-size:1.3rem;cursor:pointer;">✕</button>
    </div>
    <p style="margin:0;font-size:0.84rem;color:var(--muted);" id="dup-msg"></p>
    <div id="dup-list" style="font-size:0.82rem;color:var(--warn);max-height:160px;overflow-y:auto;background:rgba(0,0,0,0.3);border-radius:10px;padding:10px 14px;line-height:1.9;"></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;">
      <button onclick="document.getElementById('dup-modal').style.display='none'" style="flex:1;padding:11px;background:rgba(240,180,41,0.15);border:1px solid rgba(240,180,41,0.4);color:var(--warn);border-radius:10px;cursor:pointer;font-family:'Amiri',serif;font-size:0.9rem;" id="dup-fix-btn">✏️</button>
      <button onclick="proceedAfterDupCheck()" style="flex:1;padding:11px;background:linear-gradient(135deg,#c9a84c,#e8cc7a);color:#1a1000;border:none;border-radius:10px;cursor:pointer;font-family:'Amiri',serif;font-size:0.9rem;font-weight:700;" id="dup-force-btn">💾</button>
    </div>
  </div>
</div>

<!-- Language/mismatch modal -->
<div id="val-modal" style="display:none">

    <div style="display:flex;align-items:center;justify-content:space-between;">
      <h3 style="margin:0;color:var(--warn);font-size:1rem;" id="val-modal-title">⚠️</h3>
      <button onclick="document.getElementById('val-modal').style.display='none'" style="background:none;border:none;color:#aaa;font-size:1.3rem;cursor:pointer;">✕</button>
    </div>
    <p style="margin:0;font-size:0.84rem;color:var(--muted);" id="val-modal-msg"></p>
    <div id="val-modal-list" style="font-size:0.82rem;color:var(--warn);max-height:180px;overflow-y:auto;background:rgba(0,0,0,0.3);border-radius:10px;padding:10px 14px;line-height:1.8;"></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;">
      <button onclick="document.getElementById('val-modal').style.display='none'" style="flex:1;padding:11px;background:rgba(240,180,41,0.15);border:1px solid rgba(240,180,41,0.4);color:var(--warn);border-radius:10px;cursor:pointer;font-family:'Amiri',serif;font-size:0.9rem;" id="val-fix-btn">✏️</button>

  </div>
</div>

<div id="toast"></div>

    headerSub:'Page r\u00e9serv\u00e9e aux mari\u00e9s pour saisir leurs invit\u00e9s',
    sectionTitle:'\ud83d\udcca Tableau des invit\u00e9s',
    helpText:'<strong>Comment remplir :</strong> Entrez les noms de vos invit\u00e9s <strong>en fran\u00e7ais</strong> et choisissez le titre, puis cliquez sur <strong>\u00ab Enregistrer \u00bb</strong>.',
    placeholder:'Nom du convive en fran\u00e7ais...',

function lbl(k){return (LBL[_lang]||LBL.ar)[k];}

window.addEventListener('DOMContentLoaded',function(){
  var params=new URLSearchParams(window.location.search);
  _slug=params.get('inv')||params.get('w')||'';
  var autoKey=params.get('key')||params.get('pwd')||'';
  if(!_slug){
    document.getElementById('login-sub').innerHTML='&#x26A0;&#xFE0F; \u0631\u0627\u0628\u0637 \u063a\u064a\u0631 \u0635\u0627\u0644\u062d';
    document.getElementById('pwd-input').disabled=true;
    document.querySelector('.login-btn').disabled=true;
    return;
  }
  document.getElementById('pwd-input').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});
  if(autoKey){document.getElementById('pwd-input').value=autoKey;doLogin();}
});

async function doLogin(){
  var pwd=document.getElementById('pwd-input').value.trim();
  var errEl=document.getElementById('login-error');
  errEl.textContent='';
  if(!pwd){errEl.textContent='\u26a0\ufe0f \u0623\u062f\u062e\u0644 \u0643\u0644\u0645\u0629 \u0627\u0644\u0645\u0631\u0648\u0631';return;}
  try{
    initFirebase();
    var doc=await _db.collection('invitations').doc(_slug).get();
    if(!doc.exists){errEl.textContent='\u274c \u0627\u0644\u062f\u0639\u0648\u0629 \u063a\u064a\u0631 \u0645\u0648\u062c\u0648\u062f\u0629';return;}
    _invData=doc.data();
    _lang=((_invData.config&&_invData.config.la)||'ar').toLowerCase();
    var correctPwd=(_invData.couplePassword||'').trim();
    if(!correctPwd){errEl.textContent='\u26a0\ufe0f \u0644\u0645 \u064a\u062a\u0645 \u062a\u0639\u064a\u064a\u0646 \u0643\u0644\u0645\u0629 \u0645\u0631\u0648\u0631';return;}
    if(pwd!==correctPwd){errEl.textContent='\u274c \u0643\u0644\u0645\u0629 \u0627\u0644\u0645\u0631\u0648\u0631 \u063a\u064a\u0631 \u0635\u062d\u064a\u062d\u0629';document.getElementById('pwd-input').value='';return;}
    document.getElementById('login-screen').style.display='none';
    document.getElementById('main-app').style.display='block';
    initForm();
  }catch(err){console.error(err);errEl.textContent='\u274c \u062e\u0637\u0623 \u0641\u064a \u0627\u0644\u0627\u062a\u0635\u0627\u0644';}
}

function initForm(){
  var cfg=_invData.config||{};
  _lang=(cfg.la||'ar').toLowerCase();
  var isFr=_lang==='fr';
  var groom=isFr?(cfg.gf2||cfg.ga||'Le Mari\u00e9'):(cfg.ga||cfg.gf2||'\u0627\u0644\u0639\u0631\u064a\u0633');
  var bride =isFr?(cfg.bf2||cfg.ba||'La Mari\u00e9e'):(cfg.ba||cfg.bf2||'\u0627\u0644\u0639\u0631\u0648\u0633\u0629');

  document.documentElement.lang=_lang;
  document.documentElement.dir=isFr?'ltr':'rtl';

  document.getElementById('header-couple').textContent='\ud83d\udc8d '+groom+' & '+bride;
  document.getElementById('header-sub').textContent=lbl('headerSub');
  document.getElementById('section-title').textContent=lbl('sectionTitle');
  document.getElementById('help-box').innerHTML=lbl('helpText');
  document.getElementById('save-btn').textContent=lbl('saveBtn');
  document.getElementById('stat-filled-pill').innerHTML=lbl('statFilled')+' <strong id="stat-total">0</strong>';
  document.getElementById('val-modal-title').textContent=lbl('valTitle');
  document.getElementById('val-modal-msg').textContent=lbl('valMsg');
  document.getElementById('val-fix-btn').textContent=lbl('valFix');
  document.getElementById('val-force-btn').textContent=lbl('valForce');
  document.getElementById('dup-title').textContent=lbl('dupTitle');
  document.getElementById('dup-msg').textContent=lbl('dupMsg');
  document.getElementById('dup-fix-btn').textContent=lbl('dupFix');
  document.getElementById('dup-force-btn').textContent=lbl('dupForce');
  document.title=(isFr?'Liste des convives':'\u062a\u0639\u0628\u0626\u0629 \u0645\u062f\u0639\u0648\u064a')+' '+groom+' & '+bride;

  var banner=document.getElementById('lang-banner');
  banner.style.display='flex';
  banner.textContent=lbl('langBanner');

  _pack=_invData.pack||9999;
  _guests=Array.isArray(_invData.guests)?[].concat(_invData.guests):[];
  renderPackTable();
  updateStats();
}

function updateStats(){
  var n=_guests.filter(function(g){return g.name&&g.name.trim();}).length;
  var packLabel=_pack>=9999?'\u221e':_pack;
  var el=document.getElementById('stat-total');
  if(el)el.textContent=n;
  document.getElementById('stat-links').textContent=n+'/'+packLabel;
}

function hasMismatch(v){
  if(!(v||'').trim())return false;
  return(_lang==='fr'&&isArabicName(v))||(_lang==='ar'&&isLatinName(v)&&!isArabicName(v));
}

// Build personalized invitation message for an approved guest
function buildGuestMsg(name,type,link){
  var cfg=_invData&&_invData.config||{};
  var isFr=_lang==='fr';
  var groom=isFr?(cfg.gf2||cfg.ga||'Le Mari\u00e9'):(cfg.ga||cfg.gf2||'\u0627\u0644\u0639\u0631\u064a\u0633');
  var bride =isFr?(cfg.bf2||cfg.ba||'La Mari\u00e9e'):(cfg.ba||cfg.bf2||'\u0627\u0644\u0639\u0631\u0648\u0633\u0629');
  var date=cfg.wdd||cfg.wd||'';
  var salutFn=SALUTS[type]||SALUTS['ar_couple'];
  var salut=salutFn(name);
  var lines;
  if(isFr){
    lines=[
      '\ud83d\udc8d *'+salut+'*','',
      'Nous avons le grand plaisir de vous inviter \u00e0 c\u00e9l\u00e9brer le mariage de',
      '*'+groom+'* et *'+bride+'*',
      date?'\ud83d\udcc5 '+date:null,'',
      'Votre invitation personnalis\u00e9e a \u00e9t\u00e9 pr\u00e9par\u00e9e sp\u00e9cialement pour vous :','',
      '\u2728 *Votre invitation personnalis\u00e9e :*','\ud83d\udd17 '+link,'',
      'Nous serons honor\u00e9s de votre pr\u00e9sence \ud83c\udf38',
    ];
  } else {
    lines=[
      '\ud83d\udc8d *'+salut+'*','',
      '\u064a\u0633\u0639\u062f\u0646\u0627 \u0648\u0628\u0643\u0644 \u0627\u0644\u0641\u062e\u0631 \u062f\u0639\u0648\u062a\u0643\u0645 \u0644\u062d\u0636\u0648\u0631',
      '\u062d\u0641\u0644 \u0632\u0641\u0627\u0641 *'+groom+'* \u0648 *'+bride+'*',
      date?'\ud83d\udcc5 '+date:null,'',
      '\u062f\u0639\u0648\u062a\u0643\u0645 \u0627\u0644\u0634\u062e\u0635\u064a\u0629 \u062c\u0627\u0647\u0632\u0629\u060c \u064a\u0645\u0643\u0646\u0643\u0645 \u0641\u062a\u062d\u0647\u0627 \u0639\u0628\u0631:','',
      '\u2728 *\u062f\u0639\u0648\u062a\u0643\u0645 \u0627\u0644\u0634\u062e\u0635\u064a\u0629:*','\ud83d\udd17 '+link,'',
      '\u0646\u062a\u0634\u0631\u0641 \u0628\u062d\u0636\u0648\u0631\u0643\u0645 \ud83c\udf38',
    ];
  }
  return lines.filter(function(l){return l!==null;}).join('\n');
}

// Global helpers for approved guest buttons (avoids inline escaping issues)
function copyGuestMsg(idx){
  var msg=_msgStore[idx];
  if(!msg)return;
  navigator.clipboard.writeText(msg).then(function(){showToast(lbl('copiedToast'));}).catch(function(){
    // fallback
    var ta=document.createElement('textarea');
    ta.value=msg;document.body.appendChild(ta);ta.select();
    document.execCommand('copy');document.body.removeChild(ta);
    showToast(lbl('copiedToast'));
  });
}
function waGuestMsg(idx){
  var msg=_msgStore[idx];
  if(!msg)return;
  window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank');
}

function renderPackTable(){
  var container=document.getElementById('pack-rows-container');
  if(!container)return;
  var FORMULAS=getFormulas();
  var defaultType=getDefaultType();
  var baseUrl=window.location.href.split('?')[0].replace('submit-guests.html','index.html');
  var targetCount=(_pack&&_pack<9999)?_pack:Math.max(_guests.length+5,20);
  var html='';
  _msgStore={}; // reset message store on each render

  for(var i=0;i<targetCount;i++){
    var existing=_guests[i]||{name:'',type:defaultType};
    var nameVal=existing.name||'';
    var hasName=!!(nameVal.trim());
    var views=existing.views||0;
    var isApproved=existing.status==='approved';
    var storedType=existing.type||defaultType;
    var matchedType=FORMULAS.some(function(f){return f.value===storedType;})?storedType:defaultType;
    var formulaLabel='';
    for(var fi=0;fi<FORMULAS.length;fi++){if(FORMULAS[fi].value===matchedType){formulaLabel=FORMULAS[fi].label;break;}}

    // ── APPROVED: frozen read-only row ──
    if(isApproved&&hasName){
      var guestId=existing.id||'';
      var link=guestId?(baseUrl+'?inv='+encodeURIComponent(_slug)+'&gid='+encodeURIComponent(guestId)):'#';
      var msg=link!=='#'?buildGuestMsg(nameVal,matchedType,link):'';
      _msgStore[i]=msg;
      var viewsText=views>0?lbl('viewsCount')(views):lbl('viewsNone');
      html+='<div style="display:flex;gap:8px;align-items:center;background:rgba(46,204,113,0.05);border:1px solid rgba(46,204,113,0.35);border-radius:12px;padding:10px 12px;flex-wrap:wrap;margin-bottom:4px;">';
      html+='<span style="font-size:0.82rem;color:var(--gold);font-weight:bold;width:24px;text-align:center;flex-shrink:0;">'+(i+1)+'</span>';
      html+='<div style="flex:1;display:flex;flex-direction:column;gap:5px;min-width:200px;">';
      html+='<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">';
      html+='<span style="font-size:0.92rem;color:#fff;font-weight:bold;flex:1;">'+escHtml(nameVal)+'</span>';
      html+='<span style="font-size:0.75rem;color:var(--muted);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:2px 8px;">'+escHtml(formulaLabel)+'</span>';
      html+='</div>';
      html+='<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;">';
      html+='<span style="font-size:0.72rem;color:#82e0aa;background:rgba(46,204,113,0.08);border:1px solid rgba(46,204,113,0.25);border-radius:20px;padding:2px 9px;">'+lbl('approvedLabel')+'</span>';
      html+='<span style="font-size:0.72rem;color:'+(views>0?'#82e0aa':'rgba(200,180,120,0.6)')+';background:'+(views>0?'rgba(46,204,113,0.08)':'rgba(201,168,76,0.06)')+';border:1px solid '+(views>0?'rgba(46,204,113,0.25)':'rgba(201,168,76,0.15)')+';border-radius:20px;padding:2px 9px;">\uD83D\uDC41\uFE0F '+viewsText+'</span>';
      html+='</div>';
      if(msg){
        html+='<div style="display:flex;gap:5px;flex-wrap:wrap;">';
        html+='<button onclick="copyGuestMsg('+i+')" style="flex:1;min-width:120px;padding:7px 12px;background:linear-gradient(135deg,#c9a84c,#e8cc7a);color:#1a1000;border:none;border-radius:10px;cursor:pointer;font-family:\'Amiri\',serif;font-size:0.85rem;font-weight:bold;">'+lbl('copyBtn')+'</button>';
        html+='<button onclick="waGuestMsg('+i+')" style="flex-shrink:0;padding:7px 12px;background:#25d366;color:white;border:none;border-radius:10px;cursor:pointer;font-family:\'Amiri\',serif;font-size:0.85rem;">\uD83D\uDCAC</button>';
        html+='</div>';
      }
      html+='</div></div>';
      continue;
    }

    // ── PENDING / EMPTY: editable row ──
    var optionsHtml='';
    for(var fi2=0;fi2<FORMULAS.length;fi2++){
      var f=FORMULAS[fi2];
      optionsHtml+='<option value="'+f.value+'"'+(f.value===matchedType?' selected':'')+'>'+f.label+'</option>';
    }
    var mismatch=hasMismatch(nameVal);
    var borderColor=mismatch?'rgba(240,180,41,0.55)':(hasName?'rgba(201,168,76,0.3)':'rgba(201,168,76,0.2)');
    var inputBorder=mismatch?'border-color:rgba(240,180,41,0.7);background:rgba(240,180,41,0.04);':'';
    var warnHtml=mismatch?'<div class="name-warn"><span>\u26a0\ufe0f</span><span>'+lbl('warnLang')+'</span></div>':'';
    var viewsBadge=hasName?'<span class="views-badge'+(views>0?' opened':'')+'>\uD83D\uDC41\uFE0F '+(views>0?lbl('viewsCount')(views):lbl('viewsNone'))+'</span>':'';
    var pendingBadge=hasName?'<span style="font-size:0.72rem;color:rgba(240,180,41,0.8);background:rgba(240,180,41,0.07);border:1px solid rgba(240,180,41,0.25);border-radius:20px;padding:2px 9px;">'+lbl('pendingLabel')+'</span>':'';
    var dirAttr=_lang==='fr'?'ltr':'rtl';
    html+='<div style="display:flex;gap:8px;align-items:flex-start;background:rgba(0,0,0,0.25);border:1px solid '+borderColor+';border-radius:12px;padding:10px 12px;flex-wrap:wrap;margin-bottom:4px;" id="row-'+i+'">';
    html+='<span style="font-size:0.82rem;color:var(--gold);font-weight:bold;width:24px;text-align:center;flex-shrink:0;padding-top:10px;">'+(i+1)+'</span>';
    html+='<div style="flex:1;display:flex;flex-direction:column;gap:4px;min-width:200px;">';
    html+='<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;">';
    html+='<input type="text" class="pack-name-input f-input" data-index="'+i+'" value="'+escHtml(nameVal)+'" placeholder="'+lbl('placeholder')+'" dir="'+dirAttr+'" style="flex:1;min-width:110px;padding:8px 10px;font-size:0.9rem;'+inputBorder+'" oninput="validateNameInput(this,'+i+')">';
    html+='<select class="pack-type-select f-input" data-index="'+i+'" style="min-width:150px;padding:8px 6px;font-size:0.8rem;background:#181005;color:var(--text);flex-shrink:0;">'+optionsHtml+'</select>';
    html+='</div>';
    html+='<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;">'+pendingBadge+viewsBadge+'<div id="warn-'+i+'" style="flex:1;">'+warnHtml+'</div></div>';
    html+='</div></div>';
  }
  container.innerHTML=html;
}

function validateNameInput(input,idx){
  var val=input.value.trim();
  var row=document.getElementById('row-'+idx);
  var warnEl=document.getElementById('warn-'+idx);
  if(!val){
    if(row)row.style.borderColor='rgba(201,168,76,0.2)';
    input.style.borderColor='';input.style.background='';
    if(warnEl)warnEl.innerHTML='';return;
  }
  if(hasMismatch(val)){
    input.style.borderColor='rgba(240,180,41,0.7)';input.style.background='rgba(240,180,41,0.04)';
    if(row)row.style.borderColor='rgba(240,180,41,0.55)';
    if(warnEl)warnEl.innerHTML='<div class="name-warn"><span>\u26a0\ufe0f</span><span>'+lbl('warnLang')+'</span></div>';
  } else {
    input.style.borderColor='rgba(46,204,113,0.5)';input.style.background='';
    if(row)row.style.borderColor='rgba(46,204,113,0.35)';
    if(warnEl)warnEl.innerHTML='';
  }
}

function collectGuests(){
  var nameInputs=document.querySelectorAll('.pack-name-input');
  var typeSelects=document.querySelectorAll('.pack-type-select');
  var list=[];var now=Date.now();
  nameInputs.forEach(function(input,i){
    var name=input.value.trim();
    var type=typeSelects[i]?typeSelects[i].value:getDefaultType();
    if(name){
      var existing=_guests[i];
      if(existing){list.push(Object.assign({},existing,{name:name,type:type}));}
      else{list.push({id:(now+i).toString(36)+Math.random().toString(36).slice(2,5),name:name,type:type,status:'pending',createdAt:new Date().toISOString()});}
    }
  });
  return list;
}

function findDuplicates(list){
  var seen={};
  list.forEach(function(g){var k=(g.name||'').trim().toLowerCase();if(k)seen[k]=(seen[k]||0)+1;});
  var dups=[];
  list.forEach(function(g){var k=(g.name||'').trim().toLowerCase();if(seen[k]>1&&dups.indexOf(g.name)===-1)dups.push(g.name);});
  return dups;
}

async function saveGuestListSubmit(){
  var list=collectGuests();
  var dups=findDuplicates(list);
  if(dups.length>0){
    _pendingAfterDupCheck=list;
    document.getElementById('dup-list').innerHTML=dups.map(function(n,i){return (i+1)+'. <strong>'+escHtml(n)+'</strong>';}).join('<br>');
    document.getElementById('dup-modal').style.display='flex';
    return;
  }
  await checkLangAndSave(list);
}

async function proceedAfterDupCheck(){
  document.getElementById('dup-modal').style.display='none';
  if(_pendingAfterDupCheck)await checkLangAndSave(_pendingAfterDupCheck);
  _pendingAfterDupCheck=null;
}

async function checkLangAndSave(list){
  var mismatches=list.filter(function(g){return hasMismatch(g.name);});
  if(mismatches.length>0){
    _pendingList=list;
    document.getElementById('val-modal-list').innerHTML=mismatches.map(function(g,i){return (i+1)+'. <strong>'+escHtml(g.name)+'</strong>';}).join('<br>');
    document.getElementById('val-modal').style.display='flex';
    return;
  }
  await doSave(list);
}

async function forceSave(){
  document.getElementById('val-modal').style.display='none';
  if(_pendingList)await doSave(_pendingList);
  _pendingList=null;
}

async function doSave(list){
  _guests=list;
  try{
    initFirebase();
    await _db.collection('invitations').doc(_slug).update({
      guests:_guests.map(function(g){return {id:g.id,name:g.name,type:g.type,status:g.status||'pending',createdAt:g.createdAt,views:g.views||0};}),
      hasUnsentGuests:true,
      lastSubmittedAt:firebase.firestore.FieldValue.serverTimestamp()
    });
    renderPackTable();
    updateStats();
    showToast(lbl('saveOk')(list.length));
  }catch(e){console.error('Save failed:',e);showToast(lbl('saveErr'));}
}

function escHtml(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function showToast(msg){var t=document.getElementById('toast');if(t){t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},3500);}}
</script>
